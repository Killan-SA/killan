<!-- Squelette statique : sert uniquement à la détection des formulaires par Netlify au déploiement -->
<html>
  <body>
    <form name="rendez-vous" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="rendez-vous" />
      <input name="nom" />
      <input name="email" />
      <input name="telephone" />
      <select name="prestation"><option>-</option></select>
      <input name="date" />
      <select name="creneau"><option>-</option></select>
      <input name="premiere-visite" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
